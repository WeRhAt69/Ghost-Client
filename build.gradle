buildscript {
    repositories {
        maven { url = "https://fabricmc.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.9.2"
    }
}

apply plugin: "net.fabricmc.fabric-loom"
apply plugin: "maven-publish"

version = '1.0.0'
group = 'com.example'

base {
    archivesName = 'ghostclient'
}

repositories {
    maven { url = "https://fabricmc.net" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    mappings "net.fabricmc:yarn:26.1.2+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.149.1+26.1.2"
}

loom {
    mixin {
        defaultRefmapName = "ghostclient-refmap.json"
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
